name: pages

# 背包示例的在线试玩：https://lumiogames.github.io/LGUI/
# 需要先在仓库 Settings → Pages 里把 Source 设成 GitHub Actions。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: node scripts/sync-examples.mjs
      - run: node scripts/build-demo.mjs examples/inventory _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
